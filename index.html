<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log de Treino</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c0e0f">
<script>
  // tema de teste por link: ?tema=azul (sem o parâmetro, verde padrão)
  try{ var t = new URLSearchParams(location.search).get('tema'); if(t === 'azul') document.documentElement.dataset.tema = 'azul'; }catch(e){}
</script>
<link rel="icon" href="icon-v3-192.png">
<link rel="apple-touch-icon" href="icon-v3-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --bg: #0c0e0f;
    --bg-raised: #16191a;
    --bg-card: #14171a;
    --chalk: #f4f3ee;
    --chalk-dim: #9aa09c;
    --steel: #5f6462;
    --line: #262a29;
    --accent: #c6ff3a;
    --accent-dim: #4a5a1a;
    --cyan: #4fd6e8;
    --done: #4fbf6b;
    --done-dim: #1a3323;
    --font-display: 'Anton', sans-serif;
    --font-body: 'Work Sans', sans-serif;
    --font-mono: 'Space Mono', monospace;
  }
  /* TEMA DE TESTE: só ativa com ?tema=azul no endereço; o app instalado continua verde */
  :root[data-tema="azul"]{
    --accent: #3d7bff;
    --accent-dim: #1c3170;
    --done: #3d7bff;
    --done-dim: #132347;
  }
  :root[data-tema="azul"] .result-panel{background:linear-gradient(to right, #17213a, #161e33);}
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--bg);
    color: var(--chalk);
    font-family: var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing: antialiased;
  }
  .app{max-width:720px;margin:0 auto;padding:20px 16px 80px;}

  header.top{
    display:flex;align-items:baseline;justify-content:space-between;
    padding:8px 4px 20px;border-bottom:2px solid var(--line);margin-bottom:20px;
  }
  header.top h1{
    font-family:var(--font-display);font-weight:700;font-size:22px;
    letter-spacing:0.5px;text-transform:uppercase;margin:0;
  }
  header.top .date{font-family:var(--font-mono);color:var(--steel);font-size:13px;}

  nav.tabs{display:flex;gap:2px;margin-bottom:20px;background:var(--bg-raised);padding:4px;border-radius:8px;}
  nav.tabs button{
    flex:1;padding:10px 4px;background:transparent;border:none;color:var(--chalk-dim);
    font-family:var(--font-display);font-size:12px;letter-spacing:0.3px;text-transform:uppercase;
    border-radius:6px;cursor:pointer;transition:background .15s, color .15s;
  }
  nav.tabs button.active{background:var(--accent);color:#0a0c0b;font-weight:600;}

  .guia-title{
    font-family:var(--font-display);font-size:20px;text-transform:uppercase;letter-spacing:0.5px;
    color:var(--chalk);margin:28px 0 12px;
  }
  .guia-section:first-child .guia-title{margin-top:4px;}
  .quiet-link{
    display:block;margin:18px auto 4px;background:none;border:none;cursor:pointer;
    font-family:var(--font-mono);font-size:12px;color:var(--steel);text-decoration:underline;
    text-underline-offset:3px;letter-spacing:0.5px;
  }
  .quiet-link:hover{color:var(--chalk-dim);}
  .view{display:none;}
  .view.active{display:block;}

  .card{
    background:var(--bg-card);border:1px solid var(--line);border-radius:10px;
    padding:18px;margin-bottom:16px;
  }
  .empty{
    text-align:center;padding:40px 20px;color:var(--steel);
  }
  .empty .big{font-family:var(--font-display);font-size:18px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;}
  .empty p{font-size:13px;margin:0;}

  button.primary{
    background:var(--accent);color:#0a0c0b;border:none;font-family:var(--font-display);
    font-weight:600;letter-spacing:0.5px;text-transform:uppercase;font-size:14px;
    padding:12px 20px;border-radius:8px;cursor:pointer;width:100%;
  }
  button.primary:active{opacity:0.85;}
  button.ghost{
    background:transparent;border:1px solid var(--line);color:var(--chalk-dim);
    font-family:var(--font-body);font-size:13px;padding:8px 14px;border-radius:6px;cursor:pointer;
  }
  button.icon{background:none;border:none;color:var(--steel);cursor:pointer;font-size:16px;padding:4px 8px;}
  button.icon:hover{color:var(--accent);}

  .workout-name{font-family:var(--font-display);font-size:22px;text-transform:uppercase;letter-spacing:0.5px;margin:0 0 4px;}
  .workout-date{font-family:var(--font-mono);color:var(--steel);font-size:12px;margin-bottom:16px;text-transform:capitalize;}

  .block{margin-bottom:18px;}
  .block-title-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .block-title{
    font-family:var(--font-display);font-size:13px;text-transform:uppercase;letter-spacing:1px;
    color:var(--accent);border-left:3px solid var(--accent);padding-left:8px;
  }
  .block-cat-tag{
    font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:0.5px;
    color:var(--steel);border:1px solid var(--line);padding:2px 7px;border-radius:10px;white-space:nowrap;
  }
  .exercise-row{
    display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);
  }
  .exercise-row:last-child{border-bottom:none;}
  .exercise-check{
    width:22px;height:22px;border-radius:50%;border:2px solid var(--steel);flex-shrink:0;
    cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;
  }
  .exercise-check.done{background:var(--done);border-color:var(--done);color:#0d1a10;}
  .exercise-info{flex:1;min-width:0;}
  .exercise-name{font-size:14px;font-weight:500;}
  .exercise-prescribed{font-family:var(--font-mono);font-size:12px;color:var(--chalk-dim);margin-top:2px;}
  .exercise-log{width:92px;flex-shrink:0;}
  .exercise-log input{
    width:100%;background:var(--bg-raised);border:1px solid var(--line);color:var(--chalk);
    font-family:var(--font-mono);font-size:13px;padding:6px 8px;border-radius:6px;text-align:right;
  }
  .exercise-log input::placeholder{color:var(--steel);}
  .exercise-log-label{font-size:9px;color:var(--steel);text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:3px;text-align:right;}

  .notes-field textarea{
    width:100%;background:var(--bg-raised);border:1px solid var(--line);color:var(--chalk);
    font-family:var(--font-body);font-size:13px;padding:10px;border-radius:6px;resize:vertical;min-height:50px;
  }
  label.field-label{font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--steel);display:block;margin:14px 0 6px;}

  .save-bar{display:flex;gap:10px;margin-top:18px;}

  input.text-input, select.text-input{
    width:100%;background:var(--bg-raised);border:1px solid var(--line);color:var(--chalk);
    font-family:var(--font-body);font-size:14px;padding:10px 12px;border-radius:6px;
  }
  select.text-input{-webkit-appearance:none;appearance:none;}
  .form-block{border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px;background:var(--bg-raised);}
  .form-block-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;}
  .form-block-header input{max-width:100%;}
  .form-cat-row{margin-bottom:10px;}
  .form-cat-row select{font-size:12px;padding:8px 10px;}
  .form-item-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px;}
  .form-item-row input{font-size:13px;padding:8px 10px;}
  .add-link{
    background:none;border:1px dashed var(--line);color:var(--chalk-dim);width:100%;
    padding:8px;border-radius:6px;font-size:12px;cursor:pointer;margin-top:4px;
  }

  .week-strip{display:flex;gap:6px;margin-bottom:8px;}
  .week-day{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:8px 0 7px;border-radius:8px;cursor:pointer;background:var(--bg-raised);
    border:1px solid transparent;
  }
  .week-day .wd-label{font-size:9px;color:var(--steel);text-transform:uppercase;letter-spacing:0.5px;}
  .week-day .wd-num{font-family:var(--font-mono);font-size:13px;color:var(--chalk-dim);}
  .week-day.today{border-color:var(--line);}
  .week-day.selected{background:var(--accent);}
  .week-day.selected .wd-label, .week-day.selected .wd-num{color:#0a0c0b;}
  .week-day .wd-dot{width:4px;height:4px;border-radius:50%;background:var(--done);margin-top:1px;}
  .week-day.selected .wd-dot{background:#0a0c0b;}
  .week-day .wd-dot.empty{background:transparent;}
  .week-day .wd-dot.planned{background:var(--steel);}

  .week-nav-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .week-nav-row button{background:none;border:none;color:var(--steel);font-size:14px;cursor:pointer;padding:2px 8px;}
  .week-nav-row button:hover{color:var(--chalk);}
  .month-toggle{
    background:none;border:none;color:var(--steel);font-size:11px;text-transform:uppercase;letter-spacing:0.5px;
    cursor:pointer;font-family:var(--font-display);padding:2px 4px;
  }
  .month-toggle:hover{color:var(--accent);}

  .calendar{
    background:var(--bg-card);border:1px solid var(--line);border-radius:10px;
    padding:14px 16px 16px;margin-bottom:16px;display:none;
  }
  .calendar.open{display:block;}
  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .cal-header .cal-month{font-family:var(--font-display);font-size:13px;text-transform:uppercase;letter-spacing:0.5px;color:var(--chalk-dim);}
  .cal-nav button{background:var(--bg-raised);border:1px solid var(--line);color:var(--chalk-dim);width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:12px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-dow{font-size:9px;color:var(--steel);text-align:center;padding-bottom:4px;text-transform:uppercase;letter-spacing:0.5px;}
  .cal-day{
    position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    border-radius:7px;font-family:var(--font-mono);font-size:11px;cursor:pointer;color:var(--chalk-dim);
  }
  .cal-day.other-month{color:var(--steel);opacity:0.3;}
  .cal-day.today{border:1px solid var(--accent);color:var(--chalk);}
  .cal-day.selected{background:var(--accent);color:#0a0c0b;font-weight:700;}
  .cal-day .dot{
    position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
    width:3px;height:3px;border-radius:50%;background:var(--done);
  }
  .cal-day.selected .dot{background:#0a0c0b;}

  .hist-item{
    background:var(--bg-card);border:1px solid var(--line);border-radius:10px;
    margin-bottom:10px;overflow:hidden;
  }
  .hist-head{
    display:flex;justify-content:space-between;align-items:center;padding:14px 16px;cursor:pointer;
  }
  .hist-head-left .name{font-family:var(--font-display);font-size:15px;text-transform:uppercase;letter-spacing:0.3px;}
  .hist-head-left .date{font-family:var(--font-mono);font-size:11px;color:var(--steel);margin-top:2px;}
  .hist-head-right{color:var(--steel);font-size:12px;}
  .hist-body{padding:0 16px 16px;border-top:1px solid var(--line);display:none;}
  .hist-body.open{display:block;}
  .hist-block-title{font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--accent);margin:14px 0 6px;}
  .hist-ex-row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line);}
  .hist-ex-row:last-child{border-bottom:none;}
  .hist-ex-name{color:var(--chalk-dim);}
  .hist-ex-val{font-family:var(--font-mono);color:var(--chalk);text-align:right;}
  .hist-ex-val .prescribed{color:var(--steel);font-size:11px;display:block;}

  .prog-select{margin-bottom:18px;}
  .prog-timeline{display:flex;flex-direction:column;gap:0;}
  .prog-row{
    display:grid;grid-template-columns:90px 1fr auto;gap:12px;align-items:center;
    padding:12px 0;border-bottom:1px solid var(--line);
  }
  .prog-row:last-child{border-bottom:none;}
  .prog-date{font-family:var(--font-mono);font-size:11px;color:var(--steel);}
  .prog-bar-track{background:var(--bg-raised);border-radius:4px;height:8px;overflow:hidden;}
  .prog-bar-fill{background:var(--accent);height:100%;border-radius:4px;}
  .prog-val{font-family:var(--font-mono);font-size:13px;text-align:right;white-space:nowrap;}
  .prog-delta{font-size:10px;margin-left:6px;}
  .prog-delta.up{color:var(--done);}
  .prog-delta.down{color:var(--accent);}

  .chart-wrap{position:relative;height:260px;margin-bottom:8px;}
  .evo-legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  .evo-chip{
    display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;
    color:var(--chalk-dim);background:var(--bg-raised);border:1px solid var(--line);
    padding:5px 10px;border-radius:20px;
  }
  .evo-chip .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .evo-summary{display:flex;flex-direction:column;gap:0;}
  .evo-row{
    display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);
  }
  .evo-row:last-child{border-bottom:none;}
  .evo-row-left{display:flex;align-items:center;gap:8px;}
  .evo-row-left .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .evo-row-name{font-size:13px;}
  .evo-row-meta{font-family:var(--font-mono);font-size:10px;color:var(--steel);}
  .evo-row-delta{font-family:var(--font-mono);font-size:14px;font-weight:600;}
  .evo-row-delta.up{color:var(--done);}
  .evo-row-delta.down{color:var(--accent);}
  .evo-row-delta.flat{color:var(--steel);}

  .hero-swipe{touch-action:pan-y;}
  .day-nav{
    display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;
  }
  .day-nav-btn{
    background:var(--bg-raised);border:1px solid var(--line);color:var(--chalk-dim);
    font-family:var(--font-display);font-size:11px;text-transform:uppercase;letter-spacing:0.5px;
    padding:8px 14px;border-radius:8px;cursor:pointer;
  }
  .day-nav-btn:active{background:var(--line);}
  .day-nav-today{
    font-family:var(--font-mono);font-size:10px;color:var(--steel);
    text-transform:uppercase;letter-spacing:1px;
  }
  .day-nav-today-btn{
    background:none;border:none;color:var(--accent);font-family:var(--font-display);
    font-size:11px;text-transform:uppercase;letter-spacing:0.5px;cursor:pointer;padding:6px;
  }

  .result-panel{
    background:linear-gradient(to right, #1d2a20, #1b2620);
    border-left:3px solid var(--done);
    border-radius:0 8px 8px 0;
    padding:10px 14px;margin-top:12px;
  }
  .result-label{
    font-family:var(--font-display);font-size:9px;text-transform:uppercase;letter-spacing:1.2px;
    color:var(--done);margin-bottom:3px;
  }
  .result-value{
    font-family:var(--font-mono);font-size:13px;color:var(--chalk);line-height:1.45;
  }

  .block-rpe-tag{
    font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:0.5px;
    color:#0a0c0b;background:var(--accent);padding:3px 8px;border-radius:10px;white-space:nowrap;font-weight:700;
  }
  .exercise-bullet{
    width:22px;height:22px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  }
  .exercise-bullet::before{
    content:'';width:5px;height:5px;border-radius:50%;background:var(--steel);
  }
  .block-done-row{
    display:flex;align-items:center;gap:10px;padding:12px 0 2px;margin-top:4px;
    border-top:1px solid var(--line);
  }
  .block-done-label{font-size:12px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:0.5px;}

  /* ---------- RECALIBRA TAB ---------- */
  .rc-layout{display:flex;flex-direction:column;gap:20px;}
  .rc-day-banner{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--bg-card);border:1px solid var(--line);border-radius:10px;
    padding:14px 18px;font-family:var(--font-mono);font-size:12px;color:var(--chalk-dim);
  }
  .rc-day-banner b{color:var(--chalk);}
  .rc-field-group{margin-bottom:18px;}
  .rc-field-group-title{
    font-family:var(--font-mono);font-size:10px;color:var(--accent);text-transform:uppercase;
    letter-spacing:1.5px;margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid var(--line);
  }
  .rc-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .rc-row3{display:grid;grid-template-columns:1.4fr 1fr auto;gap:8px;align-items:end;margin-bottom:10px;}
  .rc-row3 input, .rc-row2 input{margin-bottom:0;}
  select.text-input{cursor:pointer;}


  .rc-upload-zone{
    border:2px dashed var(--line);border-radius:10px;padding:20px;text-align:center;cursor:pointer;
    margin-bottom:6px;
  }
  .rc-upload-zone.has-photo{border-style:solid;border-color:var(--accent);}
  .rc-upload-zone input{display:none;}
  .rc-upload-zone .txt{font-size:12px;color:var(--chalk-dim);}
  .rc-hint{font-size:11px;color:var(--steel);margin-top:6px;line-height:1.4;}
  .rc-editor-block{
    border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;background:var(--bg-raised);
  }
  .rc-editor-block-label{
    font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:1px;
    border:1px solid var(--line);border-radius:20px;padding:4px 12px;display:inline-block;margin-bottom:10px;
    color:var(--chalk-dim);
  }

  button.rc-ex-btn{
    background:none;border:1px dashed var(--line);color:var(--chalk-dim);width:100%;
    padding:9px;border-radius:7px;font-size:12px;cursor:pointer;margin-top:2px;
  }
  button.rc-remove-btn{
    background:none;border:1px solid var(--line);color:var(--chalk-dim);border-radius:7px;
    width:36px;height:36px;cursor:pointer;font-size:14px;flex-shrink:0;
  }
  .rc-slider-row{display:flex;align-items:center;gap:12px;}
  input[type=range]{flex:1;accent-color:var(--accent);}
  .rc-slider-val{font-family:var(--font-mono);font-size:12px;color:var(--accent);width:36px;text-align:right;}

  .rc-export-status{font-size:12px;color:var(--chalk-dim);margin-top:8px;text-align:center;min-height:16px;}

  .rc-preview-scaler{
    width:100%;max-width:420px;margin:0 auto;overflow:hidden;border-radius:16px;border:1px solid var(--line);
  }
  .rc-preview-inner{width:1080px;height:1920px;transform-origin:top left;}
  .rc-preview-scaler.rc-adjusting{touch-action:none;outline:3px solid var(--accent);outline-offset:3px;}
  .rc-frame{width:1080px;height:1920px;position:relative;overflow:hidden;background:#333;}
  .rc-photo-layer{position:absolute;inset:0;overflow:hidden;background-color:#000;}
  .rc-photo-layer img, .rc-photo-layer video{position:absolute;top:0;left:0;user-select:none;pointer-events:none;max-width:none;}
  .rc-adjust-bar{
    background:var(--bg-card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
    display:flex;flex-direction:column;gap:10px;
  }
  .rc-adjust-btn{
    width:100%;padding:11px;border-radius:8px;border:1px solid var(--line);background:var(--bg-raised);
    color:var(--chalk-dim);font-family:var(--font-mono);font-size:12px;text-transform:uppercase;letter-spacing:1px;cursor:pointer;
  }
  .rc-adjust-btn.on{background:var(--accent);color:#0a0c0b;border-color:var(--accent);font-weight:700;}
  .rc-zoom-label{font-family:var(--font-mono);font-size:11px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:1px;}
  .rc-mask{position:absolute;inset:0;}
  .rc-safe{
    position:absolute;top:320px;left:110px;right:110px;bottom:320px;
    display:flex;flex-direction:column;justify-content:center;
  }
  /* selo RBSN em x 766-927, y 1449-1762, mesma posição do selo da arte padrão; texto termina em 1430 */
  .rc-frame .rc-safe{bottom:490px;}
  .rc-selo{position:absolute;left:766px;top:1449px;width:161px;height:auto;pointer-events:none;}
  /* dias longos: aperta só os espaçamentos, fontes mantidas */
  .rc-compact .rc-block-section{margin-bottom:18px;}

    letter-spacing:3px;margin-bottom:16px;
  }
  .rc-kicker{
    font-family:var(--font-mono);font-size:26px;color:var(--accent);text-transform:uppercase;
    letter-spacing:4px;margin-bottom:22px;
  }

    position:relative;margin-top:14px;
  }
  .rc-score-label{
    font-family:var(--font-mono);font-size:18px;color:var(--chalk-dim);text-transform:uppercase;
    letter-spacing:3px;font-weight:700;
  }
  .rc-score-format{
    font-family:var(--font-body);font-weight:700;font-size:24px;color:var(--chalk-dim);margin-top:4px;
  }
  .rc-score-value{
    font-family:var(--font-display);font-size:80px;line-height:1;color:var(--chalk);margin-top:6px;
  }
  .rc-score-cap{
    font-family:var(--font-body);font-size:20px;color:var(--chalk-dim);margin-top:6px;
  }
  .rc-block-section{margin-bottom:30px;}
  .rc-block-label{
    font-family:var(--font-mono);font-size:32px;font-weight:700;text-transform:uppercase;letter-spacing:2.5px;
    margin-bottom:10px;color:var(--accent);text-shadow:0 2px 8px rgba(0,0,0,0.6);
  }
  .rc-wod-list{width:100%;display:flex;flex-direction:column;}
  .rc-wod-item{
    display:flex;flex-wrap:nowrap;justify-content:space-between;align-items:baseline;
    padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.16);
  }

    font-family:var(--font-body);font-weight:700;font-size:34px;line-height:1.15;

  }
  .rc-wod-item-reps{
    font-family:var(--font-mono);font-weight:700;font-size:27px;line-height:1;
    color:var(--chalk);white-space:nowrap;flex-shrink:0;margin-left:18px;
  }
  .rc-stat-row{display:flex;gap:14px;width:100%;flex-wrap:wrap;margin-top:32px;}
  .rc-pill{
    font-family:var(--font-mono);font-size:20px;color:var(--chalk-dim);border:1px solid var(--chalk-dim);

  }

    padding:14px 0;border-bottom:1px solid var(--line);
  }
  .rpe-row:last-child{border-bottom:none;}

    font-family:var(--font-display);font-size:20px;font-weight:700;text-align:center;

  }

  .rpe-note{

  }
  .rpe-note strong{color:var(--chalk-dim);}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--done);color:#0d1a10;padding:10px 20px;border-radius:8px;
    font-family:var(--font-display);font-size:13px;text-transform:uppercase;letter-spacing:0.5px;
    opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  ::selection{background:var(--accent);color:#0a0c0b;}
</style>

function mergeMonthProgram(){
  let changed = false;
  MONTH_PROGRAM.forEach(progW=>{
    const idx = workouts.findIndex(w=>w.date===progW.date);
    if(idx === -1){
      workouts.push(JSON.parse(JSON.stringify(progW)));
      changed = true;
    } else {
      const existing = workouts[idx];
      const hasResults = existing.blocks.some(b=>b.items.some(i=>i.logged && i.logged.trim()));
      if(!hasResults){
        const merged = JSON.parse(JSON.stringify(progW));
        merged.id = existing.id;
        merged.notes = existing.notes || '';
        workouts[idx] = merged;
        changed = true;
      }
    }
  });
  return changed;
}

async function loadWorkouts(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    workouts = raw ? JSON.parse(raw) : [];
  }catch(e){
    workouts = [];
  }
  let changed = false;
  workouts.forEach(w => w.blocks.forEach(b => {
    if(!b.category){ b.category = 'metcon'; changed = true; }
    if(b.result === undefined){ b.result = ''; changed = true; }
    if(b.rpe === undefined){ b.rpe = ''; changed = true; }
  }));
  if(mergeMonthProgram()) changed = true;
  if(changed) await persistWorkouts();
}

async function persistWorkouts(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(workouts));
  }catch(e){
    showToast('Erro ao salvar');
    console.error(e);
  }
}

function getWorkoutByDate(date){ return workouts.find(w => w.date === date); }

/* ---------- TAB SWITCHING ---------- */
// abas do menu: hoje (TREINO), guia (GUIA), recalibra (MÍDIA).
// historico (lista completa) não tem botão: abre pelo link dentro de TREINO.
function showTab(tab){
  const navTab = tab === 'historico' ? 'hoje' : tab;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab === navTab));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+tab).classList.add('active');
  if(tab === 'hoje') renderHoje();
  if(tab === 'historico') renderHistorico();
  if(tab === 'guia') renderGuia();
  if(tab === 'recalibra') renderRecalibraTab();
  window.scrollTo(0, 0);
}
document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=> showTab(btn.dataset.tab));
});

/* ---------- WEEK STRIP ---------- */
function getWeekDates(anchorISO){
  const d = dateFromISO(anchorISO);
  const dow = d.getDay();
  const sunday = addDays(anchorISO, -dow);
  const dates = [];
  for(let i=0;i<7;i++) dates.push(addDays(sunday, i));
  return dates;
}

function renderWeekStrip(){
  const wrap = document.createElement('div');
  const dates = getWeekDates(weekAnchor);
  const today = todayISO();
  const workoutDates = new Set(workouts.map(w=>w.date));
  const doneDates = new Set(workouts.filter(w=>w.blocks.some(b=>b.done)).map(w=>w.date));

  wrap.innerHTML = `
    <div class="week-nav-row">
      <button id="weekPrev">‹</button>
      <button class="month-toggle" id="monthToggleBtn">${monthOpen ? 'Ocultar mês' : 'Ver mês'}</button>
      <button id="weekNext">›</button>
    </div>
    <div class="week-strip">
      ${dates.map(iso=>{
        const dt = dateFromISO(iso);
        const classes = ['week-day'];
        if(iso === today) classes.push('today');
        if(iso === selectedDate) classes.push('selected');
        const hasWorkout = workoutDates.has(iso);
        return `<div class="${classes.join(' ')}" data-iso="${iso}">
          <span class="wd-label">${DOW_SHORT[dt.getDay()]}</span>
          <span class="wd-num">${dt.getDate()}</span>
          <span class="wd-dot ${hasWorkout ? (doneDates.has(iso) ? '' : 'planned') : 'empty'}"></span>
        </div>`;
      }).join('')}
    </div>
  `;

  wrap.querySelector('#weekPrev').addEventListener('click', ()=>{ weekAnchor = addDays(weekAnchor, -7); rerenderActiveTab(); });
  wrap.querySelector('#weekNext').addEventListener('click', ()=>{ weekAnchor = addDays(weekAnchor, 7); rerenderActiveTab(); });
  wrap.querySelector('#monthToggleBtn').addEventListener('click', ()=>{ monthOpen = !monthOpen; rerenderActiveTab(); });
  wrap.querySelectorAll('.week-day[data-iso]').forEach(el=>{
    el.addEventListener('click', ()=>{
      selectedDate = el.dataset.iso; weekAnchor = selectedDate; editingDraft = false; rerenderActiveTab();
    });
  });
  return wrap;
}

/* ---------- MONTH CALENDAR ---------- */
function renderCalendar(){
  const el = document.createElement('div');
  el.className = 'calendar' + (monthOpen ? ' open' : '');
  if(!monthOpen) return el;

  const firstOfMonth = new Date(calYear, calMonth, 1);
  const startDow = firstOfMonth.getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const daysInPrevMonth = new Date(calYear, calMonth, 0).getDate();
  const workoutDates = new Set(workouts.map(w=>w.date));
  const today = todayISO();

  let cells = [];
  for(let i=startDow-1;i>=0;i--) cells.push({day: daysInPrevMonth - i, other:true, iso:null});
  for(let d=1; d<=daysInMonth; d++){
    const iso = calYear + '-' + String(calMonth+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    cells.push({day:d, other:false, iso});
  }
  while(cells.length % 7 !== 0) cells.push({day: cells.length, other:true, iso:null});

  el.innerHTML = `
    <div class="cal-header">
      <div class="cal-nav"><button id="calPrev">‹</button></div>
      <span class="cal-month">${MONTHS[calMonth]} ${calYear}</span>
      <div class="cal-nav"><button id="calNext">›</button></div>
    </div>
    <div class="cal-grid">
      ${DOW.map(d=>`<div class="cal-dow">${d[0]}</div>`).join('')}
      ${cells.map(c=>{
        if(c.other) return `<div class="cal-day other-month">${c.day}</div>`;
        const classes = ['cal-day'];
        if(c.iso === today) classes.push('today');
        if(c.iso === selectedDate) classes.push('selected');
        const hasWorkout = workoutDates.has(c.iso);
        return `<div class="${classes.join(' ')}" data-iso="${c.iso}">${c.day}${hasWorkout?'<span class="dot"></span>':''}</div>`;
      }).join('')}
    </div>
  `;

  el.querySelector('#calPrev').addEventListener('click', ()=>{ calMonth--; if(calMonth<0){calMonth=11;calYear--;} rerenderActiveTab(); });
  el.querySelector('#calNext').addEventListener('click', ()=>{ calMonth++; if(calMonth>11){calMonth=0;calYear++;} rerenderActiveTab(); });
  el.querySelectorAll('.cal-day[data-iso]').forEach(dEl=>{
    dEl.addEventListener('click', ()=>{
      selectedDate = dEl.dataset.iso; weekAnchor = selectedDate; editingDraft = false; rerenderActiveTab();
    });
  });
  return el;
}

/* ---------- NAVEGAÇÃO ENTRE DIAS ---------- */
function goToDay(delta){
  selectedDate = addDays(selectedDate, delta);
  weekAnchor = selectedDate;
  const d = dateFromISO(selectedDate);
  calMonth = d.getMonth(); calYear = d.getFullYear();
  editingDraft = false;
  rerenderActiveTab();
}

function renderDayNav(){
  const wrap = document.createElement('div');
  wrap.className = 'day-nav';
  const isToday = selectedDate === todayISO();
  wrap.innerHTML = `
    <button class="day-nav-btn" id="dayPrev">‹ Anterior</button>
    ${isToday ? '<span class="day-nav-today">hoje</span>' : '<button class="day-nav-today-btn" id="dayToday">ir para hoje</button>'}
    <button class="day-nav-btn" id="dayNext">Próximo ›</button>
  `;
  wrap.querySelector('#dayPrev').addEventListener('click', ()=> goToDay(-1));
  wrap.querySelector('#dayNext').addEventListener('click', ()=> goToDay(1));
  const t = wrap.querySelector('#dayToday');
  if(t) t.addEventListener('click', ()=>{
    selectedDate = todayISO();
    weekAnchor = selectedDate;
    const d = dateFromISO(selectedDate);
    calMonth = d.getMonth(); calYear = d.getFullYear();
    editingDraft = false;
    rerenderActiveTab();
  });
  return wrap;
}

function attachSwipe(el){
  let startX = 0, startY = 0, tracking = false;

  el.addEventListener('touchstart', (e)=>{
    if(e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    tracking = true;
  }, {passive:true});

  el.addEventListener('touchmove', (e)=>{
    if(!tracking) return;
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    // cancela se o gesto for mais vertical que horizontal (scroll)
    if(Math.abs(dy) > Math.abs(dx)) { tracking = false; return; }
    if(Math.abs(dx) > 10) el.style.transform = `translateX(${dx * 0.3}px)`;
  }, {passive:true});

  el.addEventListener('touchend', (e)=>{
    if(!tracking) return;
    tracking = false;
    const dx = e.changedTouches[0].clientX - startX;
    el.style.transition = 'transform .18s ease';
    el.style.transform = '';
    setTimeout(()=>{ el.style.transition = ''; }, 200);
    if(Math.abs(dx) < 60) return;
    goToDay(dx < 0 ? 1 : -1);
  }, {passive:true});

  // teclado (desktop)
  if(!window._swipeKeysBound){
    window._swipeKeysBound = true;
    document.addEventListener('keydown', (e)=>{
      const onTreino = document.getElementById('view-hoje').classList.contains('active');
      if(!onTreino || editingDraft) return;
      if(e.key === 'ArrowLeft') goToDay(-1);
      if(e.key === 'ArrowRight') goToDay(1);
    });
  }
}

function renderHero(bodyEl){
  const w = getWorkoutByDate(selectedDate);
  const isFuture = selectedDate > todayISO();
  const isToday = selectedDate === todayISO();

  if(!w && !editingDraft){
    bodyEl.innerHTML = `
      <div class="card empty">
        <div class="big">${isFuture ? 'Nenhum treino planejado' : 'Nenhum resultado registrado'}</div>
        <p>${isToday ? 'Hoje · ' : ''}${fmtDateLong(selectedDate)}</p>
      </div>
      <button class="primary" id="btnNewWorkout">+ Registrar resultado do treino</button>
    `;
    bodyEl.querySelector('#btnNewWorkout').addEventListener('click', ()=>{ editingDraft = true; renderHoje(); });
    return;
  }

  if(editingDraft){ renderWorkoutForm(bodyEl, w); return; }

  let html = `<div class="card">
    <div class="workout-name">${escapeHtml(w.name)}</div>
    <div class="workout-date">${isToday ? 'Hoje · ' : ''}${fmtDateLong(w.date)}</div>`;

  w.blocks.forEach((block, bi)=>{
    const cat = catInfo(block.category);
    const conditioning = isConditioning(block.category);
    html += `<div class="block">
      <div class="block-title-row">

          <div class="block-cat-tag" style="border-color:${cat.color}55;color:${cat.color};">${cat.label}</div>

      </div>`;
    block.items.forEach((item, ii)=>{
      html += `
        <div class="exercise-row">
          <div class="exercise-bullet"></div>
          <div class="exercise-info">
            <div class="exercise-name">${escapeHtml(item.exercise)}</div>
            <div class="exercise-prescribed">${escapeHtml(item.prescribed||'')}</div>
          </div>
        </div>`;
    });
    if(block.done){
      html += `
        <div class="result-panel">
          <div class="result-label">Resultado</div>
          <div class="result-value">${escapeHtml(block.done)}</div>
        </div>`;
    }
    html += `</div>`;

  html += `
    <div class="save-bar">
      <button class="ghost" id="btnEditWorkout" style="width:100%;">Editar treino</button>
    </div>
  </div>`;

  bodyEl.innerHTML = html;

  bodyEl.querySelector('#btnEditWorkout').addEventListener('click', ()=>{ editingDraft = true; renderHoje(); });
}

  function renderForm(){
    let html = `<div class="card">
      <label class="field-label">${fmtDateLong(draft.date)}</label>
      <label class="field-label">Nome do treino</label>
      <input class="text-input" id="fName" type="text" placeholder="ex: Treino 4 — Quinta" value="${escapeAttr(draft.name)}">
      <div id="fBlocks" style="margin-top:16px;"></div>
      <button class="add-link" id="btnAddBlock">+ Adicionar bloco</button>
      <div class="save-bar">
        <button class="primary" id="btnSaveWorkout">Salvar</button>
        <button class="ghost" id="btnCancelForm">Cancelar</button>
      </div>
    </div>`;
    bodyEl.innerHTML = html;
    renderBlocks();

    bodyEl.querySelector('#fName').addEventListener('input', e=> draft.name = e.target.value);
    bodyEl.querySelector('#btnAddBlock').addEventListener('click', ()=>{
      draft.blocks.push({title:'Bloco '+String.fromCharCode(65+draft.blocks.length), category:'metcon', items:[{exercise:'', prescribed:'', logged:'', done:false}]});
      renderBlocks();
    });
    bodyEl.querySelector('#btnSaveWorkout').addEventListener('click', async ()=>{
      if(!draft.name.trim()){ showToast('Dê um nome ao treino'); return; }
      draft.blocks = draft.blocks.filter(b => b.items.some(i => i.exercise.trim()));
      draft.blocks.forEach(b => b.items = b.items.filter(i => i.exercise.trim()));
      if(draft.blocks.length === 0){ showToast('Adicione ao menos um exercício'); return; }

      const idx = workouts.findIndex(x=>x.id===draft.id);
      if(idx >= 0) workouts[idx] = draft; else workouts.push(draft);
      await persistWorkouts();
      editingDraft = false;
      renderHoje();
      showToast('Salvo');
    });
    bodyEl.querySelector('#btnCancelForm').addEventListener('click', ()=>{ editingDraft = false; renderHoje(); });
  }

  function renderBlocks(){
    const wrap = bodyEl.querySelector('#fBlocks');
    wrap.innerHTML = '';
    draft.blocks.forEach((block, bi)=>{
      const div = document.createElement('div');
      div.className = 'form-block';

/* ---------- CARGAS (por exercício) VIEW ---------- */
function extractNumeric(str){
  if(!str) return null;
  const m = str.match(/[\d]+([.,]\d+)?/);
  if(!m) return null;
  return parseFloat(m[0].replace(',','.'));
}

function renderProgressao(){
  const container = document.getElementById('view-progressao');
  const exerciseNames = new Set();
  workouts.forEach(w => w.blocks.forEach(b => b.items.forEach(it=>{
    if(it.exercise.trim()) exerciseNames.add(it.exercise.trim());
  })));

  if(exerciseNames.size === 0){
    container.innerHTML = `<div class="card empty"><div class="big">Sem dados ainda</div><p>Registre resultados para ver a evolução por exercício.</p></div>`;
    return;
  }

  const names = [...exerciseNames].sort((a,b)=>a.localeCompare(b));
  container.innerHTML = `
    <div class="card">
      <div class="prog-select">
        <select class="text-input" id="progExSelect">
          ${names.map(n=>`<option value="${escapeAttr(n)}">${escapeHtml(n)}</option>`).join('')}
        </select>
      </div>
      <div class="prog-timeline" id="progTimeline"></div>
    </div>
  `;

  const select = document.getElementById('progExSelect');
  select.addEventListener('change', ()=> renderTimeline(select.value));
  renderTimeline(names[0]);
}

function renderTimeline(exName){
  const el = document.getElementById('progTimeline');
  const entries = [];
  [...workouts].sort((a,b)=>a.date.localeCompare(b.date)).forEach(w=>{
    w.blocks.forEach(b=>b.items.forEach(it=>{
      if(it.exercise.trim() === exName && it.logged && it.logged.trim()){
        entries.push({date: w.date, logged: it.logged, num: extractNumeric(it.logged)});
      }
    }));
  });

  if(entries.length === 0){
    el.innerHTML = `<p style="color:var(--steel);font-size:13px;">Nenhum resultado salvo para este exercício ainda.</p>`;
    return;
  }

  const nums = entries.map(e=>e.num).filter(n=>n!==null);
  const max = nums.length ? Math.max(...nums) : 0;

  el.innerHTML = entries.map((e, idx)=>{
    const pct = (e.num !== null && max > 0) ? Math.max(6, (e.num/max)*100) : 0;
    let delta = '';
    if(idx > 0 && e.num !== null && entries[idx-1].num !== null){
      const diff = e.num - entries[idx-1].num;
      if(diff !== 0) delta = `<span class="prog-delta ${diff>0?'up':'down'}">${diff>0?'▲':'▼'} ${Math.abs(diff).toFixed(1)}</span>`;
    }
    return `
      <div class="prog-row">
        <div class="prog-date">${fmtDate(e.date)}</div>
        <div class="prog-bar-track">${e.num!==null ? `<div class="prog-bar-fill" style="width:${pct}%;"></div>` : ''}</div>
        <div class="prog-val">${escapeHtml(e.logged)}${delta}</div>
      </div>
    `;
  }).join('');
}

/* ---------- EVOLUÇÃO (valências) VIEW ---------- */
function parseWodResult(str){
  if(!str || !str.trim()) return null;
  const timeMatch = str.match(/(\d+):(\d{2})/);
  if(timeMatch){
    const seconds = parseInt(timeMatch[1],10)*60 + parseInt(timeMatch[2],10);
    return {value: seconds, lowerIsBetter: true};
  }
  const num = extractNumeric(str);
  if(num === null) return null;
  return {value: num, lowerIsBetter: false};
}

function buildCategorySeries(){
  const byDate = {};
  workouts.forEach(w=>{
    if(w.date > todayISO()) return;
    w.blocks.forEach(b=>{
      const cat = b.category || 'metcon';
      if(isConditioning(cat)){
        const parsed = parseWodResult(b.result);
        if(!parsed) return;
        if(!byDate[w.date]) byDate[w.date] = {};
        if(!byDate[w.date][cat]) byDate[w.date][cat] = [];
        byDate[w.date][cat].push(parsed);
      } else {
        const nums = b.items.map(it => extractNumeric(it.logged)).filter(n => n !== null);
        if(nums.length === 0) return;
        const avg = nums.reduce((a,c)=>a+c,0) / nums.length;
        if(!byDate[w.date]) byDate[w.date] = {};
        if(!byDate[w.date][cat]) byDate[w.date][cat] = [];
        byDate[w.date][cat].push({value: avg, lowerIsBetter: false});
      }
    });
  });

  const dates = Object.keys(byDate).sort();
  const seriesByCat = {};
  dates.forEach(date=>{
    Object.keys(byDate[date]).forEach(cat=>{
      const entries = byDate[date][cat];
      const avg = entries.reduce((a,c)=>a+c.value,0)/entries.length;
      const lowerIsBetter = entries[0].lowerIsBetter;
      if(!seriesByCat[cat]) seriesByCat[cat] = [];
      seriesByCat[cat].push({date, value: avg, lowerIsBetter});
    });
  });
  return seriesByCat;
}

function renderEvolucao(){
  const container = document.getElementById('view-evolucao');
  const seriesByCat = buildCategorySeries();
  const catsPresent = Object.keys(seriesByCat).filter(c => seriesByCat[c].length >= 1);

  if(catsPresent.length === 0){
    container.innerHTML = `<div class="card empty"><div class="big">Sem dados suficientes</div><p>Registre resultados numéricos (kg, cal, reps, tempo) para ver a evolução das valências.</p></div>`;
    return;
  }

  const needsTwo = catsPresent.filter(c => seriesByCat[c].length >= 2);

  container.innerHTML = `
    <div class="card">
      <div class="chart-wrap"><canvas id="evoCanvas"></canvas></div>
      <div class="evo-legend">
        ${catsPresent.map(c=>{
          const info = catInfo(c);
          return `<div class="evo-chip"><span class="dot" style="background:${info.color};"></span>${info.label}</div>`;
        }).join('')}
      </div>
      ${needsTwo.length === 0 ? `<p style="color:var(--steel);font-size:12px;">Índice de evolução (100 = primeiro registro de cada valência). Registre mais resultados para ver tendência.</p>` : ''}
    </div>
    <div class="card">
      <label class="field-label">Leitura por valência</label>
      <div class="evo-summary">
        ${catsPresent.map(c=>{
          const info = catInfo(c);
          const series = seriesByCat[c];
          const first = series[0].value;
          const last = series[series.length-1].value;
          const lowerIsBetter = series[0].lowerIsBetter;
          let pct = first !== 0 ? ((last-first)/first*100) : 0;
          if(lowerIsBetter) pct = -pct;
          const dir = series.length < 2 ? 'flat' : (pct > 1 ? 'up' : (pct < -1 ? 'down' : 'flat'));
          const label = series.length < 2 ? '— só 1 registro' : (dir==='up' ? '▲ evoluindo' : (dir==='down' ? '▼ em queda' : '● estável'));
          return `
            <div class="evo-row">
              <div class="evo-row-left">
                <span class="dot" style="background:${info.color};"></span>
                <div>
                  <div class="evo-row-name">${info.label}</div>
                  <div class="evo-row-meta">${series.length} registro${series.length>1?'s':''}</div>
                </div>
              </div>
              <div class="evo-row-delta ${dir}">${series.length<2 ? label : (pct>=0?'+':'') + pct.toFixed(0)+'% '+ label.split(' ')[0]}</div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;

  const allDatesSet = new Set();
  catsPresent.forEach(c => seriesByCat[c].forEach(p => allDatesSet.add(p.date)));
  const allDates = [...allDatesSet].sort();

  const datasets = catsPresent.map(c=>{
    const info = catInfo(c);
    const series = seriesByCat[c];
    const first = series[0].value;
    const lowerIsBetter = series[0].lowerIsBetter;
    const map = {};
    series.forEach(p => {
      if(first === 0){ map[p.date] = 100; return; }
      map[p.date] = lowerIsBetter ? (first/p.value)*100 : (p.value/first)*100;
    });
    const data = allDates.map(d => map[d] !== undefined ? map[d] : null);
    return {
      label: info.label, data, borderColor: info.color, backgroundColor: info.color,
      spanGaps: true, tension: 0.3, pointRadius: 3, pointHoverRadius: 5, borderWidth: 2
    };
  });

  const ctx = document.getElementById('evoCanvas').getContext('2d');
  if(evoChart) evoChart.destroy();
  if(typeof Chart === 'undefined'){
    container.querySelector('.chart-wrap').innerHTML = '<p style="color:var(--steel);font-size:12px;">Gráfico indisponível no momento.</p>';
    return;
  }
  evoChart = new Chart(ctx, {
    type: 'line',
    data: { labels: allDates.map(fmtDateShort), datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#232220', titleColor: '#ede8dd', bodyColor: '#a6a099',
          borderColor: '#38362f', borderWidth: 1,
          callbacks: { label: (item)=> item.dataset.label + ': ' + Math.round(item.raw) }
        }
      },
      scales: {
        x: { grid: { color: '#2a2925' }, ticks: { color: '#6b6f76', font: { family: 'JetBrains Mono', size: 10 } } },
        y: { grid: { color: '#2a2925' }, ticks: { color: '#6b6f76', font: { family: 'JetBrains Mono', size: 10 } }, title: { display:true, text:'Índice (100 = início)', color:'#6b6f76', font:{size:10} } }
      }
    }
  });
}

const RC_START_DATE = '2026-08-31';
const RC_WEEK_PHASES = [
  {start:'2026-08-31', end:'2026-09-05', label:'Semana 1 · Retomada', week:1},
  {start:'2026-09-07', end:'2026-09-12', label:'Semana 2 · Progressão', week:2},
  {start:'2026-09-14', end:'2026-09-19', label:'Semana 3 · Pico', week:3},
  {start:'2026-09-21', end:'2026-09-25', label:'Semana 4 · Deload', week:4},
  {start:'2026-09-28', end:'2026-09-30', label:'Semana 5 · Fechamento', week:5},
  {start:'2026-10-01', end:'2026-10-31', label:'Ciclo 02', week:null}
];
function rcPhaseFor(iso){
  for(const w of RC_WEEK_PHASES){ if(iso >= w.start && iso <= w.end) return w; }
  return {label:'', week:null};
}
function rcDayIndexOf(iso){
  const start = dateFromISO(RC_START_DATE);
  const d = dateFromISO(iso);
  return Math.round((d - start) / 86400000) + 1;
}

const RC_META_LABELS = ['referência','estratégia','baseline','baselines','nota','importante',
  'atenção','foco','foco técnico','critério','como fazer','durante os tiros','registrar',
  'progressão','comparar','comparação final','origem','opção','sem push vertical',
  'teste da conversa','volta à calma','descanso','descanso antes do teste','geral','específico',
  'se quiser mover','relógio'];

function rcSimplifyTitle(name){
  return name
    .replace(/^Treino\s+\d+\s*—\s*/,'')
    .split(' (')[0]
    .split(' — ')[0]
    .trim();
}

function rcSplitPrescribed(exerciseName, raw){
  if(!raw) return {name: exerciseName, qty: ''};
  let s = raw;
  s = s.replace(/\|?\s*alvo\s*RPE[^|]*/gi, '');
  s = s.replace(/ref:\s*/gi, '');

  const schemeMatch = s.match(/^(\d+x\d+|\d+(-\d+)+)/);
  const scheme = schemeMatch ? schemeMatch[0] : '';

  const kgMatch = s.match(/(\d+(?:[,.]\d+)?(?:-\d+(?:[,.]\d+)?)?)\s*kg/i);
  const kg = kgMatch ? kgMatch[0].replace(/\s+/g,'') : '';

  let name = exerciseName;
  if(kg && !/kg/i.test(exerciseName)){
    name = `${exerciseName} (${kg})`;
  }

  let qty = scheme;
  if(!qty){
    const rest = (kgMatch ? s.replace(kgMatch[0], '') : s).trim();
    // número + unidade opcional; m/km mantidos (400m, 7,5 km)
    const NUM = /^\d+(?:[,.]\d+)?(?:\s*(?:-|a)\s*\d+(?:[,.]\d+)?)?(?:\s*(?:min|seg|s|reps?|rounds?|km|m)\b|x)?/i;
    // rótulo antes de dois-pontos: "Min ímpar: 12", "Min par: 40s forte"
    const labelMatch = rest.match(/^(min(?:uto)?s?\s+(?:ímpar|impar|par)(?:es)?)\s*:\s*(.*)$/i);
    // formato no início: "EMOM 10 min x 2", "AMRAP 12", "E2MOM 8 min"
    const fmtMatch = rest.match(/^(E\d*MOM|AMRAP|Tabata|For\s+time|RFT)\b[^,;|—]*/i);
    if(labelMatch){
      const label = labelMatch[1].charAt(0).toUpperCase() + labelMatch[1].slice(1).toLowerCase();
      const n = labelMatch[2].match(NUM);
      qty = n ? `${label}: ${n[0].trim()}` : label;
    } else if(fmtMatch){
      qty = fmtMatch[0].replace(/\s+/g,' ').trim();
    } else {
      const numMatch = rest.match(NUM);
      if(numMatch) qty = numMatch[0].trim();
    }
  }
  return {name, qty};
}

function rcSeedFromDay(){
  const w = getWorkoutByDate(selectedDate);
  if(!w){ rcSeededDate = null; rcBlocks = []; return; }
  if(rcSeededDate === selectedDate) return;
  rcSeededDate = selectedDate;

  const avail = rcAvailableBlocks(w);

  rcBlocks = avail.map(block => {

    const items = block.items.filter(it => !RC_META_LABELS.includes(it.exercise.trim().toLowerCase()));
    return {
      label, category: block.category, catColor: cat.color,
      items: items.map(it => {
        const split = rcSplitPrescribed(it.exercise, it.prescribed);
        return {name: split.name, reps: split.qty};
      }),
      rpe: block.rpe || '', done: block.done || '', titleRaw: block.title

}

function rcLooksLikeScore(s){
  if(!s) return false;
  const t = s.trim();
  if(/^\d+:\d{2}$/.test(t)) return true;
  if(/rounds?/i.test(t)) return true;
  if(/^\d+\s*reps?$/i.test(t)) return true;
  if(/^\d+(-\d+)+$/.test(t)) return true;
  return false;
}

function rcCleanScore(str){
  if(!str) return '';
  let s = str.split(' · ')[0].split(' — ')[0].trim();

let rcDefaultBgLoading = false;
function rcUseDefaultBg(){
  if(rcDefaultBgLoading) return;
  rcDefaultBgLoading = true;
  const img = new Image();
  img.onload = ()=>{
    rcDefaultBgLoading = false;
    if(rcPhotoDataUrl && !rcIsDefaultBg){
      URL.revokeObjectURL(rcPhotoDataUrl);
      rcUserMask = rcMaskOpacity;
    }
    rcPhotoDataUrl = RC_DEFAULT_BG;
    rcMediaType = 'image';
    rcMediaName = RC_DEFAULT_BG;
    rcIsDefaultBg = true;
    rcPhotoNaturalW = img.naturalWidth;
    rcPhotoNaturalH = img.naturalHeight;
    rcPhotoMinScale = Math.max(1080/img.naturalWidth, 1920/img.naturalHeight);
    rcPhotoScale = rcPhotoMinScale;
    rcPhotoOffsetX = 0;
    rcPhotoOffsetY = 0;
    rcAdjustMode = false;
    rcMaskOpacity = 0;       // a arte já é escura; máscara apagaria o escudo
    const view = document.getElementById('view-recalibra');
    if(view && view.classList.contains('active')) renderRecalibraTab();
  };
  img.onerror = ()=>{ rcDefaultBgLoading = false; rcDefaultBgFailed = true; };
  img.src = RC_DEFAULT_BG;
}

function rcLoadMediaFile(file){
  const isVideo = file.type.startsWith('video/');
  const url = URL.createObjectURL(file);
  const onReady = (natW, natH)=>{
    if(rcIsDefaultBg){
      rcIsDefaultBg = false;
      rcMaskOpacity = rcUserMask;
    } else if(rcPhotoDataUrl){
      URL.revokeObjectURL(rcPhotoDataUrl);
    }
    rcPhotoDataUrl = url;
    rcMediaType = isVideo ? 'video' : 'image';
    rcMediaName = file.name;
    rcPhotoNaturalW = natW;
    rcPhotoNaturalH = natH;
    rcPhotoMinScale = Math.max(1080/natW, 1920/natH);
    rcPhotoScale = rcPhotoMinScale;
    rcPhotoOffsetX = 0;
    rcPhotoOffsetY = 0;
    rcAdjustMode = false;
    renderRecalibraTab();
  };
  const onFail = ()=>{
    URL.revokeObjectURL(url);
    const st = document.getElementById('rcExportStatus');
    if(st) st.textContent = 'Não consegui abrir esse arquivo.';
  };
  if(isVideo){
    const v = document.createElement('video');
    v.preload = 'metadata';
    v.muted = true;
    v.onloadedmetadata = ()=> (v.videoWidth && v.videoHeight) ? onReady(v.videoWidth, v.videoHeight) : onFail();
    v.onerror = onFail;
    v.src = url;
  } else {
    const img = new Image();
    img.onload = ()=> onReady(img.naturalWidth, img.naturalHeight);
    img.onerror = onFail;
    img.src = url;
  }
}

function rcApplyMask(){
  const alpha = (rcMaskOpacity/100*0.9).toFixed(2);
  const el = document.getElementById('rcMaskEl');
  if(el) el.style.background = `linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,${alpha}) 22%, rgba(0,0,0,${alpha}) 78%, rgba(0,0,0,0) 100%)`;
}

/* ---- media pan/zoom ---- */
function rcClampPhoto(){
  rcPhotoScale = Math.max(rcPhotoMinScale, Math.min(rcPhotoMinScale*3, rcPhotoScale));
  const scaledW = rcPhotoNaturalW * rcPhotoScale;
  const scaledH = rcPhotoNaturalH * rcPhotoScale;
  const maxX = Math.max(0, (scaledW - 1080)/2);
  const maxY = Math.max(0, (scaledH - 1920)/2);
  rcPhotoOffsetX = Math.max(-maxX, Math.min(maxX, rcPhotoOffsetX));
  rcPhotoOffsetY = Math.max(-maxY, Math.min(maxY, rcPhotoOffsetY));
}

function rcMediaRect(){
  rcClampPhoto();
  const w = rcPhotoNaturalW * rcPhotoScale;
  const h = rcPhotoNaturalH * rcPhotoScale;
  return { x: 540 - w/2 + rcPhotoOffsetX, y: 960 - h/2 + rcPhotoOffsetY, w, h };
}

function rcApplyPhotoTransform(){
  const el = document.getElementById('rcMediaEl');
  if(!el) return;
  const r = rcMediaRect();
  el.style.width = rcPhotoNaturalW + 'px';
  el.style.height = rcPhotoNaturalH + 'px';
  el.style.position = 'absolute';
  el.style.left = '0';
  el.style.top = '0';
  el.style.transformOrigin = '0 0';
  el.style.transform = `translate(${r.x}px, ${r.y}px) scale(${rcPhotoScale})`;
  const zs = document.getElementById('rcZoomSlider');
  const zv = document.getElementById('rcZoomVal');
  const pct = Math.round((rcPhotoScale / rcPhotoMinScale) * 100);
  if(zs) zs.value = pct;
  if(zv) zv.textContent = pct + '%';
}

let rcDrag = null; // desktop drag state

function rcAttachPhotoGestures(){
  const frame = document.getElementById('rcCaptureFrame');
  if(!frame) return;
  let mode = null; // 'pan' | 'pinch'
  let startX=0, startY=0, startOffX=0, startOffY=0;
  let startDist=0, startScale=1;

  function dist(t0,t1){ return Math.hypot(t1.clientX-t0.clientX, t1.clientY-t0.clientY); }

  frame.addEventListener('touchstart', (e)=>{
    if(!rcAdjustMode) return;
    if(e.touches.length === 1){
      mode = 'pan';
      startX = e.touches[0].clientX; startY = e.touches[0].clientY;
      startOffX = rcPhotoOffsetX; startOffY = rcPhotoOffsetY;
    } else if(e.touches.length === 2){
      mode = 'pinch';
      startDist = dist(e.touches[0], e.touches[1]);
      startScale = rcPhotoScale;
    }
  }, {passive:true});

  frame.addEventListener('touchmove', (e)=>{
    if(!rcAdjustMode) return;
    if(e.cancelable) e.preventDefault();
    if(e.touches.length === 2){
      if(mode !== 'pinch'){ mode = 'pinch'; startDist = dist(e.touches[0], e.touches[1]); startScale = rcPhotoScale; }
      const d = dist(e.touches[0], e.touches[1]);
      rcPhotoScale = startScale * (d / (startDist || 1));
      rcApplyPhotoTransform();
    } else if(mode === 'pan' && e.touches.length === 1){
      rcPhotoOffsetX = startOffX + (e.touches[0].clientX - startX) / rcPreviewScale;
      rcPhotoOffsetY = startOffY + (e.touches[0].clientY - startY) / rcPreviewScale;
      rcApplyPhotoTransform();
    }
  }, {passive:false});

  frame.addEventListener('touchend', (e)=>{
    if(e.touches.length === 1 && rcAdjustMode){
      mode = 'pan';
      startX = e.touches[0].clientX; startY = e.touches[0].clientY;
      startOffX = rcPhotoOffsetX; startOffY = rcPhotoOffsetY;
    } else if(e.touches.length === 0){
      mode = null;
    }
  }, {passive:true});

  frame.addEventListener('mousedown', (e)=>{
    if(!rcAdjustMode) return;
    rcDrag = { x: e.clientX, y: e.clientY, ox: rcPhotoOffsetX, oy: rcPhotoOffsetY };
  });
  frame.addEventListener('wheel', (e)=>{
    if(!rcAdjustMode) return;
    e.preventDefault();
    const delta = e.deltaY > 0 ? -0.05 : 0.05;
    rcPhotoScale = rcPhotoScale + delta*rcPhotoScale;
    rcApplyPhotoTransform();
  }, {passive:false});

  if(!window._rcMouseBound){
    window._rcMouseBound = true;
    window.addEventListener('mousemove', (e)=>{
      if(!rcDrag) return;
      rcPhotoOffsetX = rcDrag.ox + (e.clientX - rcDrag.x) / rcPreviewScale;
      rcPhotoOffsetY = rcDrag.oy + (e.clientY - rcDrag.y) / rcPreviewScale;
      rcApplyPhotoTransform();
    });
    window.addEventListener('mouseup', ()=>{ rcDrag = null; });
  }
}

    `;

    block.items.forEach((it, ii)=>{
      const row = document.createElement('div');

// versões progressivamente mais curtas de um nome; a carga (kg) nunca sai
function rcNameCandidates(name){
  const out = [name];
  let s = name;
  const push = v => { v = v.replace(/\s{2,}/g,' ').trim(); if(v && v !== out[out.length-1]){ out.push(v); } s = v; };
  // 1. carga de halter compacta
  push(s.replace(/\((?:dois|duas|2)\s+halteres?\s+de\s+([^)]*)\)/i, '(2x $1)')
        .replace(/\((?:um|uma|1)\s+halter\s+de\s+([^)]*)\)/i, '($1)'));
  // 2. remove parênteses descritivos sem carga, se sobrar um nome de verdade
  const noDesc = s.replace(/\s*\((?![^)]*kg)[^)]*\)/gi, '');
  if(/[a-zà-ú]{3,}/i.test(noDesc)) push(noDesc);
  // 3. abreviações, da mais leve à mais agressiva (mantém a maiúscula)
  const abbr = (re, short) => s.replace(re, m => m[0] === m[0].toUpperCase() ? short[0].toUpperCase() + short.slice(1) : short);
  push(abbr(/\balternad[oa]\b/gi, 'alt.'));
  push(abbr(/\bunilateral\b/gi, 'unil.'));
  push(s.replace(/(\d)\s+min\b/gi, '$1min'));
  push(abbr(/\bcaminhada\b/gi, 'caminh.'));
  // 4. último recurso: corta o que vem depois do travessão
  push(s.split(/\s+—\s+/)[0]);
  return out;
}

function rcShortenNames(){
  document.querySelectorAll('#rcOutBlocks .rc-wod-item-name').forEach(el=>{
    const full = el.dataset.full || el.textContent;
    el.dataset.full = full;
    const cands = rcNameCandidates(full);
    for(const c of cands){
      el.textContent = c;
      if(el.scrollWidth <= el.clientWidth + 1) return;
    }
  });
}

// a área útil termina acima do selo; se o conteúdo não couber, compacta os espaçamentos
function rcFitDefaultContent(){
  const frame = document.getElementById('rcCaptureFrame');
  if(!frame) return;
  frame.classList.remove('rc-compact');
  const safe = frame.querySelector('.rc-safe');
  const kids = [...safe.children].filter(c => c.offsetHeight);
  if(!kids.length) return;
  const first = kids[0], last = kids[kids.length-1];
  const h = last.offsetTop + last.offsetHeight - first.offsetTop;
  if(h > safe.clientHeight) frame.classList.add('rc-compact');
}

function rcFitPreview(){
  const scaler = document.getElementById('rcPreviewScaler');
  const inner = document.getElementById('rcPreviewInner');
  if(!scaler || !inner || rcExporting) return;
  const w = scaler.clientWidth;
  rcPreviewScale = w / 1080;
  inner.style.transform = `scale(${rcPreviewScale})`;
  scaler.style.height = (1920 * rcPreviewScale) + 'px';
}

/* ---- export ---- */
async function rcCaptureOverlay(){
  const inner = document.getElementById('rcPreviewInner');
  const layer = document.getElementById('rcPhotoLayer');
  const frame = document.getElementById('rcCaptureFrame');
  const savedTransform = inner.style.transform;
  const savedBg = frame.style.background;
  const selo = frame.querySelector('.rc-selo');
  if(selo && !selo.complete) await new Promise(r => { selo.onload = selo.onerror = r; });
  inner.style.transform = 'none';
  layer.style.visibility = 'hidden';
  frame.style.background = 'transparent';
  try{
    return await html2canvas(frame, {
      width:1080, height:1920, windowWidth:1080, windowHeight:1920,
      scale:1, backgroundColor:null, useCORS:true
    });
  } finally {
    inner.style.transform = savedTransform;
    layer.style.visibility = '';
    frame.style.background = savedBg;
  }
}

async function rcSaveBlob(blob, filename, status){
  try{
    const downloads = (window.claude && window.claude.use) ? await claude.use('downloads') : null;
    if(!downloads){
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 5000);
      status.textContent = 'Baixado · 1080×1920.';
    } else {
      const res = await downloads.save({ filename, data: blob });
      status.textContent = res.status === 'saved' ? 'Salvo · 1080×1920.' : 'Enviado.';
    }
  }catch(err){
    status.textContent = (err && err.code === 'declined') ? 'Cancelado.' : `Não consegui salvar (${(err && err.code) || 'erro'}). Tenta de novo.`;
  }
}

function rcPickVideoMime(){
  const candidates = [
    'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
    'video/mp4;codecs=avc1',
    'video/mp4',
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm'
  ];
  if(typeof MediaRecorder === 'undefined') return null;
  for(const m of candidates){ if(MediaRecorder.isTypeSupported(m)) return m; }
  return '';
}

async function rcExport(){
  const btn = document.getElementById('rcExportBtn');
  const status = document.getElementById('rcExportStatus');
  if(!rcPhotoDataUrl){
    status.textContent = 'Escolha uma foto ou um vídeo antes de exportar.';
    return;
  }
  if(rcExporting) return;
  rcExporting = true;
  btn.disabled = true;
  status.textContent = 'Preparando...';

  try{
    const overlay = await rcCaptureOverlay();
    if(rcMediaType === 'video'){
      await rcExportVideo(overlay, status);
    } else {
      await rcExportImage(overlay, status);
    }
  }catch(err){
    status.textContent = 'Erro ao exportar.';
  }
  rcExporting = false;
  btn.disabled = false;
  rcFitPreview();
}

function rcExportImage(overlay, status){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      canvas.width = 1080; canvas.height = 1920;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#000'; ctx.fillRect(0,0,1080,1920);
      const r = rcMediaRect();
      ctx.drawImage(img, r.x, r.y, r.w, r.h);
      ctx.drawImage(overlay, 0, 0, 1080, 1920);
      canvas.toBlob(async (blob)=>{
        if(!blob){ status.textContent = 'Falha ao gerar a imagem.'; resolve(); return; }
        await rcSaveBlob(blob, `recalibra-${selectedDate}.png`, status);
        resolve();
      }, 'image/png');
    };
    img.onerror = ()=>{ status.textContent = 'Falha ao ler a foto.'; resolve(); };
    img.src = rcPhotoDataUrl;
  });
}

async function rcExportVideo(overlay, status){
  const ok = await rcExportVideoMp4(overlay, status);
  if(!ok){
    status.textContent = 'Usando método alternativo de gravação...';
    await rcExportVideoRecorder(overlay, status);
  }
}

async function rcPickAvcConfig(){
  const codecs = ['avc1.640028','avc1.4d0028','avc1.42e028','avc1.640032','avc1.4d0032','avc1.42e032'];
  for(const codec of codecs){
    const cfg = { codec, width:1080, height:1920, bitrate:6000000, framerate:30, avc:{format:'avc'} };
    try{
      const s = await VideoEncoder.isConfigSupported(cfg);
      if(s && s.supported) return cfg;
    }catch(e){}
  }
  return null;
}

async function rcDecodeAudio(url){
  try{
    const buf = await (await fetch(url)).arrayBuffer();
    let ac;
    try{ ac = new (window.AudioContext || window.webkitAudioContext)({sampleRate:48000}); }
    catch(e){ ac = new (window.AudioContext || window.webkitAudioContext)(); }
    const audio = await ac.decodeAudioData(buf);
    try{ ac.close(); }catch(e){}
    return audio;
  }catch(e){ return null; }
}

// Gera MP4 padrão (não fragmentado, com duração no cabeçalho): compatível com galeria e Instagram
function rcExportVideoMp4(overlay, status){
  return new Promise(async (resolve)=>{
    if(typeof VideoEncoder === 'undefined' || typeof VideoFrame === 'undefined' || typeof Mp4Muxer === 'undefined'){
      resolve(false); return;
    }
    const vcfg = await rcPickAvcConfig();
    if(!vcfg){ resolve(false); return; }

    const preview = document.getElementById('rcMediaEl');
    if(preview && preview.pause) preview.pause();
    let wakeLock = null;
    try{ if(navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); }catch(e){}

    const v = document.createElement('video');
    v.src = rcPhotoDataUrl;
    v.muted = true;
    v.playsInline = true;
    v.setAttribute('playsinline','');
    v.preload = 'auto';
    v.style.cssText = 'position:fixed;left:0;top:0;width:2px;height:2px;opacity:0.01;pointer-events:none;z-index:-1;';
    document.body.appendChild(v);

    const cleanup = ()=>{
      try{ v.pause(); v.removeAttribute('src'); v.load(); v.remove(); }catch(e){}
      if(wakeLock) try{ wakeLock.release(); }catch(e){}
      if(preview && preview.play) preview.play().catch(()=>{});
    };

    const ready = await new Promise(res=>{
      if(v.readyState >= 2) return res(true);
      const to = setTimeout(()=>res(false), 10000);
      v.oncanplay = ()=>{ clearTimeout(to); res(true); };
      v.onerror = ()=>{ clearTimeout(to); res(false); };
    });
    if(!ready){ cleanup(); resolve(false); return; }

    const total = Math.min(isFinite(v.duration) && v.duration > 0 ? v.duration : RC_MAX_VIDEO_SECONDS, RC_MAX_VIDEO_SECONDS);

    // áudio: decodificado do arquivo original, codificado em AAC
    status.textContent = 'Preparando o áudio...';
    const audio = await rcDecodeAudio(rcPhotoDataUrl);
    let acfg = null;
    if(audio && typeof AudioEncoder !== 'undefined' && typeof AudioData !== 'undefined'){
      const ch = Math.min(audio.numberOfChannels, 2);
      const cand = { codec:'mp4a.40.2', sampleRate: audio.sampleRate, numberOfChannels: ch, bitrate:128000 };
      try{ const s = await AudioEncoder.isConfigSupported(cand); if(s && s.supported) acfg = cand; }catch(e){}
    }

    let muxer;
    try{
      const opts = {
        target: new Mp4Muxer.ArrayBufferTarget(),
        video: { codec:'avc', width:1080, height:1920 },
        fastStart: 'in-memory',
        firstTimestampBehavior: 'offset'
      };
      if(acfg) opts.audio = { codec:'aac', numberOfChannels: acfg.numberOfChannels, sampleRate: acfg.sampleRate };
      muxer = new Mp4Muxer.Muxer(opts);
    }catch(e){ cleanup(); resolve(false); return; }

    let encError = null;

    if(acfg){
      try{
        const aenc = new AudioEncoder({
          output: (chunk, meta)=> muxer.addAudioChunk(chunk, meta),
          error: (e)=>{ encError = e; }
        });
        aenc.configure(acfg);
        const ch = acfg.numberOfChannels;
        const frames = Math.min(audio.length, Math.floor(total * audio.sampleRate));
        const STEP = 4096;
        for(let off = 0; off < frames; off += STEP){
          const n = Math.min(STEP, frames - off);
          const data = new Float32Array(n * ch);
          for(let c = 0; c < ch; c++) data.set(audio.getChannelData(c).subarray(off, off + n), c * n);
          const ad = new AudioData({ format:'f32-planar', sampleRate: audio.sampleRate, numberOfFrames: n, numberOfChannels: ch, timestamp: Math.round(off / audio.sampleRate * 1e6), data });
          aenc.encode(ad);
          ad.close();
        }
        await aenc.flush();
        aenc.close();
      }catch(e){ encError = e; }
      if(encError){ cleanup(); resolve(false); return; }
    }

    // vídeo: cada quadro do vídeo original + máscara e textos, codificado em H.264
    const canvas = document.createElement('canvas');
    canvas.width = 1080; canvas.height = 1920;
    const ctx = canvas.getContext('2d');
    const r = rcMediaRect();
    const draw = ()=>{
      ctx.fillStyle = '#000'; ctx.fillRect(0,0,1080,1920);
      ctx.drawImage(v, r.x, r.y, r.w, r.h);
      ctx.drawImage(overlay, 0, 0, 1080, 1920);
    };

    let venc;
    try{
      venc = new VideoEncoder({
        output: (chunk, meta)=> muxer.addVideoChunk(chunk, meta),
        error: (e)=>{ encError = e; }
      });
      venc.configure(vcfg);
    }catch(e){ cleanup(); resolve(false); return; }

    let frameCount = 0;
    let lastTs = -1;
    let finished = false;
    let pausedByUs = false;
    let lastT = -1;
    let lastAdvance = performance.now();
    let stallNote = '';
    const MIN_GAP = 1e6/30 - 2000; // até ~30 quadros por segundo

    const encodeAt = (tSec)=>{
      const ts = Math.round(tSec * 1e6);
      if(lastTs >= 0 && ts - lastTs < MIN_GAP) return;
      draw();
      const frame = new VideoFrame(canvas, { timestamp: ts });
      venc.encode(frame, { keyFrame: frameCount % 60 === 0 });
      frame.close();
      frameCount++;
      lastTs = ts;
    };

    const finish = async ()=>{
      if(finished) return;
      finished = true;
      try{ v.pause(); }catch(e){}
      try{ await venc.flush(); venc.close(); }catch(e){ encError = encError || e; }
      if(encError || frameCount === 0){ cleanup(); resolve(false); return; }
      try{ muxer.finalize(); }catch(e){ cleanup(); resolve(false); return; }
      cleanup();
      const blob = new Blob([muxer.target.buffer], { type:'video/mp4' });
      status.textContent = 'Salvando...';
      await rcSaveBlob(blob, `recalibra-${selectedDate}.mp4`, status);
      if(stallNote) status.textContent += ' ' + stallNote;
      resolve(true);
    };

    const onFrame = (now, meta)=>{
      if(finished) return;
      if(encError){ finish(); return; }
      const t = meta && typeof meta.mediaTime === 'number' ? meta.mediaTime : v.currentTime;
      if(t >= total || v.ended){ finish(); return; }
      encodeAt(t);
      status.textContent = `Gerando vídeo... ${Math.floor(t)}s de ${Math.round(total)}s. Mantenha a tela ligada e o app aberto.`;
      if(venc.encodeQueueSize > 4 && !v.paused){
        pausedByUs = true;
        v.pause();
        const waitDrain = ()=>{
          if(finished) return;
          if(venc.encodeQueueSize <= 1){ pausedByUs = false; v.play().catch(()=>{}); }
          else setTimeout(waitDrain, 30);
        };
        waitDrain();
      }
      schedule();
    };

    const schedule = ()=>{
      if(finished) return;
      if(v.requestVideoFrameCallback) v.requestVideoFrameCallback(onFrame);
      else requestAnimationFrame(()=>onFrame(0, null));
    };

    const watchdog = setInterval(()=>{
      if(finished){ clearInterval(watchdog); return; }
      const t = v.currentTime;
      if(t !== lastT){ lastT = t; lastAdvance = performance.now(); }
      else if(!pausedByUs && performance.now() - lastAdvance > 6000){
        clearInterval(watchdog);
        stallNote = `O vídeo parou de avançar em ${Math.floor(t)}s; o arquivo foi salvo até esse ponto.`;
        finish();
      }
    }, 500);

    v.onended = ()=> finish();

    try{ v.currentTime = 0; }catch(e){}
    encodeAt(0);
    schedule();
    try{ await v.play(); }
    catch(e){ clearInterval(watchdog); finished = true; try{ venc.close(); }catch(e2){} cleanup(); resolve(false); }
  });
}

function rcExportVideoRecorder(overlay, status){
  return new Promise(async (resolve)=>{
    const mime = rcPickVideoMime();
    if(mime === null){
      status.textContent = 'Este navegador não grava vídeo. Tente pelo Chrome atualizado.';
      resolve(); return;
    }

    const preview = document.getElementById('rcMediaEl');
    if(preview && preview.pause) preview.pause();

    // mantém a tela ligada durante a gravação
    let wakeLock = null;
    try{ if(navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); }catch(e){}

    // vídeo de gravação dentro da página (fora da página o Chrome pode parar de decodificar)
    const v = document.createElement('video');
    v.src = rcPhotoDataUrl;
    v.playsInline = true;
    v.setAttribute('playsinline','');
    v.preload = 'auto';
    v.muted = false;
    v.style.cssText = 'position:fixed;left:0;top:0;width:2px;height:2px;opacity:0.01;pointer-events:none;z-index:-1;';
    document.body.appendChild(v);

    const cleanup = ()=>{
      try{ v.pause(); v.removeAttribute('src'); v.load(); v.remove(); }catch(e){}
      if(wakeLock) try{ wakeLock.release(); }catch(e){}
      if(preview && preview.play) preview.play().catch(()=>{});
    };

    const ready = await new Promise(res=>{
      if(v.readyState >= 2) return res(true);
      const to = setTimeout(()=>res(false), 10000);
      v.oncanplay = ()=>{ clearTimeout(to); res(true); };
      v.onerror = ()=>{ clearTimeout(to); res(false); };
    });
    if(!ready){
      cleanup();
      status.textContent = 'Não consegui abrir o vídeo para gravar.';
      resolve(); return;
    }

    const canvas = document.createElement('canvas');
    canvas.width = 1080; canvas.height = 1920;
    const ctx = canvas.getContext('2d');
    const r = rcMediaRect();
    const draw = ()=>{
      ctx.fillStyle = '#000'; ctx.fillRect(0,0,1080,1920);
      ctx.drawImage(v, r.x, r.y, r.w, r.h);
      ctx.drawImage(overlay, 0, 0, 1080, 1920);
    };
    draw();

    const stream = canvas.captureStream(30);
    let audioCtx = null;
    try{
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const src = audioCtx.createMediaElementSource(v);
      const dest = audioCtx.createMediaStreamDestination();
      src.connect(dest);
      dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
      if(audioCtx.state === 'suspended') await audioCtx.resume();
    }catch(e){ audioCtx = null; }

    const opts = { videoBitsPerSecond: 6000000 };
    if(mime) opts.mimeType = mime;
    let recorder;
    try{ recorder = new MediaRecorder(stream, opts); }
    catch(e){
      try{ recorder = new MediaRecorder(stream); }
      catch(e2){ cleanup(); status.textContent = 'Gravação não suportada neste aparelho.'; resolve(); return; }
    }

    const chunks = [];
    let recError = '';
    recorder.ondataavailable = (e)=>{ if(e.data && e.data.size) chunks.push(e.data); };
    recorder.onerror = (e)=>{ recError = (e && e.error && e.error.name) || 'erro de gravação'; };

    const total = Math.min(isFinite(v.duration) && v.duration > 0 ? v.duration : RC_MAX_VIDEO_SECONDS, RC_MAX_VIDEO_SECONDS);
    let finished = false;
    let stallNote = '';

    recorder.onstop = async ()=>{
      if(audioCtx) try{ audioCtx.close(); }catch(e){}
      cleanup();
      if(!chunks.length){
        status.textContent = 'A gravação não gerou dados' + (recError ? ` (${recError})` : '') + '.';
        resolve(); return;
      }
      const type = (recorder.mimeType || mime || 'video/webm').split(';')[0];
      const ext = type.includes('mp4') ? 'mp4' : 'webm';
      const blob = new Blob(chunks, { type });
      status.textContent = 'Salvando...';
      await rcSaveBlob(blob, `recalibra-${selectedDate}.${ext}`, status);
      if(stallNote) status.textContent += ' ' + stallNote;
      if(ext === 'webm') status.textContent += ' Formato WebM: se o Instagram recusar, me avisa.';
      resolve();
    };

    const finish = ()=>{
      if(finished) return;
      finished = true;
      try{ v.pause(); }catch(e){}
      draw();
      setTimeout(()=>{ try{ recorder.stop(); }catch(e){} }, 150);
    };

    v.onended = finish;

    let lastT = -1;
    let lastAdvance = performance.now();
    const tick = ()=>{
      if(finished) return;
      draw();
      const t = v.currentTime;
      if(t !== lastT){ lastT = t; lastAdvance = performance.now(); }
      else if(!v.paused && performance.now() - lastAdvance > 6000){
        stallNote = `A gravação travou em ${Math.floor(t)}s (vídeo parou de decodificar).`;
        finish(); return;
      }
      status.textContent = `Gravando... ${Math.floor(t)}s de ${Math.round(total)}s. Mantenha a tela ligada e o app aberto.`;
      if(t >= total){ finish(); return; }
      requestAnimationFrame(tick);
    };

    recorder.start(500);
    try{ v.currentTime = 0; }catch(e){}
    try{
      await v.play();
    }catch(e){
      v.muted = true;
      try{ await v.play(); }catch(e2){ finish(); return; }
    }
    requestAnimationFrame(tick);
  });
}

/* ---------- UTIL ---------- */
function escapeHtml(str){
  if(str === undefined || str === null) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str){ return escapeHtml(str); }
